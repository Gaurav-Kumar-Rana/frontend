name: Build and Deploy to GKE

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  PROJECT_ID: project-strategy-513311
  GAR_LOCATION: us-central1
  GKE_CLUSTER: ${{ vars.GKE_CLUSTER }}
  REPOSITORY: ${{ vars.GAR_REPOSITORY }}
  WORKLOAD_IDENTITY_PROVIDER: ${{ vars.WIF_PROVIDER }}
  IMAGE: portfolio
  NAMESPACE: portfolio

jobs:
  build-publish-deploy:
    name: Build, publish, and deploy
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check deployment configuration
        shell: bash
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          set -euo pipefail
          for name in GKE_CLUSTER REPOSITORY WORKLOAD_IDENTITY_PROVIDER; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Configure the $name GitHub Actions variable before deploying."
              exit 1
            fi
          done
          if [[ -z "$OLLAMA_API_KEY" ]]; then
            echo "::error::Configure OLLAMA_API_KEY in the production environment secrets."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # actions/checkout@v4

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2 # google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ env.PROJECT_ID }}
          token_format: access_token

      - name: Authenticate Docker to Artifact Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # docker/login-action@v3
        with:
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.auth_token }}
          registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev

      - name: Set up GKE credentials
        uses: google-github-actions/get-gke-credentials@6051de21ad50fbb1767bc93c11357a49082ad116 # google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GAR_LOCATION }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Build and push image
        env:
          IMAGE_URI: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}
        run: |
          set -euo pipefail
          docker build --tag "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Install Kustomize
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --output /tmp/kustomize.tar.gz \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz
          tar -xzf /tmp/kustomize.tar.gz -C /tmp
          /tmp/kustomize version

      - name: Configure Ollama secret
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          set -euo pipefail
          kubectl apply -f k8s/namespace.yaml
          kubectl create secret generic portfolio-secrets \
            --namespace "$NAMESPACE" \
            --from-literal=OLLAMA_API_KEY="$OLLAMA_API_KEY" \
            --dry-run=client --output=yaml | kubectl apply -f -

      - name: Deploy to internal GKE service
        run: |
          set -euo pipefail
          cd k8s
          /tmp/kustomize edit set image "frontend=$IMAGE_URI"
          /tmp/kustomize build . | kubectl apply -f -
          kubectl rollout status "deployment/$IMAGE" \
            --namespace "$NAMESPACE" --timeout=180s
          kubectl get service "$IMAGE" --namespace "$NAMESPACE" --output=wide
